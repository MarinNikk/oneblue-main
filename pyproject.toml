[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneblue"
version = "0.1.0"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    #mlflow
    "mlflow>=3.6.0",

    # Core ML libraries
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.7.0",
    "xgboost",
    
    # Data handling
    "pandas>=2.0.0",
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # CLI and UI
    "typer>=0.9.0",
    "rich>=13.0.0",
    "click>=8.0.0",  # (typer depends on this, might be redundant)
    
    # Configuration
    "pyyaml>=6.0",
    
    # Scientific computing
    "scikit-learn>=1.3.0",
    "copernicusmarine>=1.0.0",
    
    # Utilities
    "tqdm>=4.65.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "ipython>=8.12.0",
    "ipykernel>=6.25.0",
]

[project.scripts]
oneblue = "src.cli:app"

[project.urls]
Homepage = "https://github.com/MarinNikk/oneblue-prediction"
Repository = "https://github.com/MarinNikk/oneblue-prediction"
Documentation = "https://github.com/MarinNikk/oneblue-prediction#readme"

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | __pycache__
  | build
  | dist
  | data
  | models
  | plots
  | notebooks
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"

# Exclude common directories
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "models",
    "plots",
    "notebooks",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by black)
    "ARG002", # unused method argument (common in PyTorch)
    
    # Docstring rules (too pedantic for research code)
    "D100", "D101", "D102", "D103", "D104", "D105", # Missing docstrings
    "D200", "D205", "D212", "D415",                  # Docstring formatting
    
    # Other pedantic rules
    "TRY300", # return in try (sometimes cleaner)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore imports in __init__.py files
"__init__.py" = ["F401", "F403"]
# Ignore unused imports in CLI (typer uses them for discovery)
"src/cli/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^data/",
    "^models/",
    "^logs/",
    "^notebooks/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --tb=short
"""

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_gpu: marks tests that need GPU",
    "requires_copernicus: marks tests that need CMEMS credentials",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
